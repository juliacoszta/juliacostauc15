<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mimosas Food</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-login">

    <div class="login-caixa">

        <a
            href="index.html"
            class="voltar-login"
        >
            ← Voltar
        </a>

        <div class="login-icone">
            👤
        </div>

        <h1>
            Mimosas Food
        </h1>

        <p class="login-subtitulo">
            Entre na sua conta
        </p>

        <form id="formLogin">

            <div class="campo-login">

                <span>
                    👤
                </span>

                <input
                    type="email"
                    id="emailLogin"
                    placeholder="E-mail"
                    required
                >

            </div>

            <div class="campo-login">

                <span>
                    🔒
                </span>

                <input
                    type="password"
                    id="senhaLogin"
                    placeholder="Senha"
                    required
                >

            </div>

            <div class="opcoes-login">

                <label>
                    <input type="checkbox">
                    Lembrar de mim
                </label>

                <a href="#">
                    Esqueci a senha
                </a>

            </div>

            <p
                id="erroLogin"
                class="erro"
            ></p>

            <button
                type="submit"
                class="botao-entrar"
            >
                ENTRAR
            </button>

        </form>

        <div class="linha-login">
            <span>ou</span>
        </div>

        <a
            href="cadastro.html"
            class="botao-cadastro"
        >
            CRIAR UMA CONTA
        </a>

        <p class="texto-final">
            Ainda não faz parte da Mimosas Food?
        </p>

    </div>

    <script src="java.js"></script>

</body>
</html>
